<!-- Paste this into your Braze banner HTML. Sends custom event "banner_seen" when the banner is viewed, using the app's JS bridge. -->
<script>
(function() {
  function sendBannerSeen() {
    if (window.AndroidDeepLinkHandler && typeof window.AndroidDeepLinkHandler.logCustomEvent === 'function') {
      window.AndroidDeepLinkHandler.logCustomEvent('banner_seen');
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendBannerSeen);
  } else {
    sendBannerSeen();
  }
})();
</script>
